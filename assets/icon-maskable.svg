<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Set Roulette">
  <defs>
    <linearGradient id="gm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6ff3c"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff9ec7"/>
    </linearGradient>
  </defs>
  <!-- full bleed: artwork kept inside the 80% safe zone for maskable icons -->
  <rect width="512" height="512" fill="#0b0b12"/>
  <g transform="translate(256 256)">
    <circle r="112" fill="none" stroke="url(#gm)" stroke-width="16"/>
    <g stroke="url(#gm)" stroke-width="10" stroke-linecap="round" opacity="0.55">
      <line y1="-112" y2="-72"/>
      <line y1="-112" y2="-72" transform="rotate(60)"/>
      <line y1="-112" y2="-72" transform="rotate(120)"/>
      <line y1="-112" y2="-72" transform="rotate(180)"/>
      <line y1="-112" y2="-72" transform="rotate(240)"/>
      <line y1="-112" y2="-72" transform="rotate(300)"/>
    </g>
    <circle r="50" fill="#14141f" stroke="url(#gm)" stroke-width="11"/>
    <circle r="12" fill="url(#gm)"/>
  </g>
</svg>
