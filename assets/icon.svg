<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Set Roulette">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6ff3c"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff9ec7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b0b12"/>
  <g transform="translate(256 256)">
    <circle r="150" fill="none" stroke="url(#g)" stroke-width="20"/>
    <!-- wheel segments -->
    <g stroke="url(#g)" stroke-width="12" stroke-linecap="round" opacity="0.55">
      <line y1="-150" y2="-96"/>
      <line y1="-150" y2="-96" transform="rotate(60)"/>
      <line y1="-150" y2="-96" transform="rotate(120)"/>
      <line y1="-150" y2="-96" transform="rotate(180)"/>
      <line y1="-150" y2="-96" transform="rotate(240)"/>
      <line y1="-150" y2="-96" transform="rotate(300)"/>
    </g>
    <!-- vinyl centre -->
    <circle r="66" fill="#14141f" stroke="url(#g)" stroke-width="14"/>
    <circle r="16" fill="url(#g)"/>
  </g>
</svg>
